<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CzRewards - Staking</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #d4a017;
            --secondary-color: #c72c41;
            --gradient-bg: linear-gradient(180deg, #1e1e2f 0%, #3a2a3d 100%);
            --card-bg: #2c2f48;
            --input-bg: #373b5c;
            --text-color: #ffffff;
            --border-radius: 15px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--gradient-bg);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-radius: var(--border-radius);
            padding: 20px;
        }
        .header {
            background: linear-gradient(90deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            padding: 12px;
            border-radius: var(--border-radius);
            text-align: center;
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .connect-section button {
            padding: 12px;
            background: var(--primary-color);
            color: var(--text-color);
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        .connect-section button:hover { background: #b88c14; }
        .input-box {
            background: var(--input-bg);
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
        }
        .input-box label {
            display: block;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            border: none;
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1em;
            text-align: right;
        }
        .balance-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            margin-bottom: 5px;
            color: #d4a017;
        }
        .percentage-buttons {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        .percentage-buttons button {
            padding: 5px 10px;
            background: #4a4f7a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: var(--text-color);
            flex: 1;
        }
        .percentage-buttons button:hover { background: #5a5f8a; }
        .action-button {
            padding: 15px;
            background: var(--primary-color);
            color: var(--text-color);
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
            margin-bottom: 10px;
            position: relative;
        }
        .action-button:disabled {
            background: #4a4f7a;
            cursor: not-allowed;
        }
        .action-button:hover:not(:disabled) { background: #b88c14; }
        .status {
            margin-top: 10px;
            font-size: 0.9em;
            color: var(--primary-color);
            text-align: center;
        }
        .token-info {
            background: var(--input-bg);
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
        }
        .token-info p {
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .dragon-section {
            text-align: center;
            margin-top: 20px;
        }
        .dragon-section img {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }
        .dragon-message {
            font-size: 0.9em;
            color: var(--secondary-color);
            font-style: italic;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 5px;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .header { font-size: 1.1em; }
            .percentage-buttons button { padding: 5px; }
            .dragon-section img { width: 50px; height: 50px; }
            .dragon-message { font-size: 0.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">CzRewards - Staking</div>
        <div class="connect-section">
            <button id="connectWalletButton">Connect Wallet</button>
            <div id="networkStatus" class="status">Click to connect...</div>
        </div>
        <div class="input-box">
            <label>Token Info</label>
            <div class="token-info">
                <p id="snowBalance">SNOW Balance: 0</p>
                <p id="czBalance">CZ Balance: 0</p>
                <p id="snowStaked">SNOW Staked: 0</p>
                <p id="czStaked">CZ Staked: 0</p>
                <p id="pendingRewards">Pending Rewards: 0 CZ</p>
            </div>
        </div>
        <div class="input-box">
            <label>Stake SNOW (Min: 100M, Multiples of 100M)</label>
            <input type="number" id="snowStakeAmount" placeholder="e.g., 100000000" min="100000000" step="100000000">
            <div class="percentage-buttons">
                <button onclick="setSnowStakePercentage(25)">25%</button>
                <button onclick="setSnowStakePercentage(50)">50%</button>
                <button onclick="setSnowStakePercentage(75)">75%</button>
                <button onclick="setSnowStakePercentage(100)">MAX</button>
            </div>
            <button class="action-button" id="stakeSnowButton">Stake SNOW</button>
        </div>
        <div class="input-box">
            <label>Stake CZ (Min: 10K, Multiples of 10K)</label>
            <input type="number" id="czStakeAmount" placeholder="e.g., 10000" min="10000" step="10000">
            <div class="percentage-buttons">
                <button onclick="setCzStakePercentage(25)">25%</button>
                <button onclick="setCzStakePercentage(50)">50%</button>
                <button onclick="setCzStakePercentage(75)">75%</button>
                <button onclick="setCzStakePercentage(100)">MAX</button>
            </div>
            <button class="action-button" id="stakeCzButton">Stake CZ</button>
        </div>
        <div class="input-box">
            <label>Unstake SNOW</label>
            <input type="number" id="snowUnstakeAmount" placeholder="e.g., 100000000" min="100000000" step="100000000">
            <div class="percentage-buttons">
                <button onclick="setSnowUnstakePercentage(25)">25%</button>
                <button onclick="setSnowUnstakePercentage(50)">50%</button>
                <button onclick="setSnowUnstakePercentage(75)">75%</button>
                <button onclick="setSnowUnstakePercentage(100)">MAX</button>
            </div>
            <button class="action-button" id="unstakeSnowButton">Unstake SNOW</button>
        </div>
        <div class="input-box">
            <label>Unstake CZ</label>
            <input type="number" id="czUnstakeAmount" placeholder="e.g., 10000" min="10000" step="10000">
            <div class="percentage-buttons">
                <button onclick="setCzUnstakePercentage(25)">25%</button>
                <button onclick="setCzUnstakePercentage(50)">50%</button>
                <button onclick="setCzUnstakePercentage(75)">75%</button>
                <button onclick="setCzUnstakePercentage(100)">MAX</button>
            </div>
            <button class="action-button" id="unstakeCzButton">Unstake CZ</button>
        </div>
        <div class="input-box">
            <label>Claim Rewards</label>
            <button class="action-button" id="claimRewardsButton">Claim CZ Rewards</button>
        </div>
        <div class="dragon-section">
            <img src="https://www.woofswap.finance/image/tokens/shiba.gif" alt="Dragon">
            <div class="dragon-message" id="dragonMessage">"Roar! Connect your wallet to stake and earn CZ!"</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script>
        const czRewardsAddress = '0x4885c0EB85F8E168d43D9a0d4D1AB8148A515101';
        const snowAddress = '0x2778f7E40D90DB18203Ec31C9c5F84fde6cf6763';
        const czAddress = '0xB2eBA5B12c58eA1CA4A269504A2145262F690510';
        const czRewardsAbi = [
            {"inputs":[{"internalType":"address","name":"_owner","type":"address"}],"stateMutability":"nonpayable","type":"constructor"},
            {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"user","type":"address"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"}],"name":"CzStaked","type":"event"},
            {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"user","type":"address"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"}],"name":"CzUnstaked","type":"event"},
            {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"owner","type":"address"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"}],"name":"CzDeposited","type":"event"},
            {"anonymous":false,"inputs":[],"name":"MiningEnded","type":"event"},
            {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"user","type":"address"},{"indexed":false,"internalType":"uint256","name":"snowReward","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"czReward","type":"uint256"}],"name":"RewardClaimed","type":"event"},
            {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"user","type":"address"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"}],"name":"SnowStaked","type":"event"},
            {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"user","type":"address"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"}],"name":"SnowUnstaked","type":"event"},
            {"inputs":[],"name":"claimRewards","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_amount","type":"uint256"}],"name":"depositCz","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[{"internalType":"address","name":"_user","type":"address"}],"name":"getPendingRewards","outputs":[{"internalType":"uint256","name":"snowReward","type":"uint256"},{"internalType":"uint256","name":"czReward","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[],"name":"getRemainingRewards","outputs":[{"internalType":"uint256","name":"remaining","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[],"name":"getTotalStaked","outputs":[{"internalType":"uint256","name":"totalSnow","type":"uint256"},{"internalType":"uint256","name":"totalCz","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"address","name":"_user","type":"address"}],"name":"getUserHistory","outputs":[{"internalType":"uint256[]","name":"","type":"uint256[]"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"address","name":"_user","type":"address"}],"name":"getUserStake","outputs":[{"internalType":"uint256","name":"snowAmount","type":"uint256"},{"internalType":"uint256","name":"czAmount","type":"uint256"},{"internalType":"uint256","name":"userStartBlock","type":"uint256"},{"internalType":"uint256","name":"snowReward","type":"uint256"},{"internalType":"uint256","name":"czReward","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[],"name":"owner","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_amount","type":"uint256"}],"name":"stakeCz","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_amount","type":"uint256"}],"name":"stakeSnow","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[],"name":"unstakeCz","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[],"name":"unstakeSnow","outputs":[],"stateMutability":"nonpayable","type":"function"}
        ];
        const erc20Abi = [
            {"constant":true,"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"balance","type":"uint256"}],"type":"function"},
            {"constant":false,"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"success","type":"bool"}],"type":"function"},
            {"constant":true,"inputs":[{"name":"_owner","type":"address"},{"name":"_spender","type":"address"}],"name":"allowance","outputs":[{"name":"remaining","type":"uint256"}],"type":"function"}
        ];
        const chains = {
            Shibarium: {
                chainId: 109,
                chainName: 'Shibarium',
                rpcUrl: 'https://rpc.shibariumchain.com',
                blockExplorer: 'https://shibariumscan.io'
            }
        };
        let web3, account, czRewardsContract, snowContract, czContract;
        let snowBalance = '0', czBalance = '0', snowStaked = '0', czStaked = '0';
        const dragonMessages = {
            connectSuccess: ["Roar! Wallet connected, ready to stake!", "Hiss! You're in, let's earn CZ!", "Growl! Wallet's ready, time to stake!"],
            connectFail: ["Roar! Couldn't connect wallet, try again!", "Hiss! Wallet connection failed, retry!", "Growl! Something went wrong, check wallet!"],
            approveStart: ["Roar! Approving tokens, hold tight!", "Hiss! Setting up token approvals now!", "Growl! Approval in progress!"],
            approveSuccess: ["Roar! Tokens approved, proceeding to stake!", "Hiss! Token approved, staking now!", "Growl! Approval done, staking!"],
            approveFail: ["Roar! Approval failed, check details!", "Hiss! Approval error, try again!", "Growl! Approval hit a snag, retry!"],
            stakeStart: ["Roar! Staking your tokens, hold tight!", "Hiss! Locking your tokens now!", "Growl! Stake in progress!"],
            stakeSuccess: ["Roar! Tokens staked, earning CZ!", "Hiss! Your stake is active!", "Growl! Success! Stake complete!"],
            stakeFail: ["Roar! Stake failed, check balance!", "Hiss! Stake error, try again!", "Growl! Stake hit a snag, retry!"],
            unstakeStart: ["Roar! Unstaking your tokens, hold tight!", "Hiss! Releasing your tokens now!", "Growl! Unstake in progress!"],
            unstakeSuccess: ["Roar! Tokens unstaked!", "Hiss! Your tokens are back!", "Growl! Success! Unstake complete!"],
            unstakeFail: ["Roar! Unstake failed, check stake!", "Hiss! Unstake error, try again!", "Growl! Unstake hit a snag, retry!"],
            claimStart: ["Roar! Claiming your CZ rewards!", "Hiss! Collecting your earnings now!", "Growl! Claim in progress!"],
            claimSuccess: ["Roar! CZ rewards claimed!", "Hiss! Your rewards are yours!", "Growl! Success! Rewards claimed!"],
            claimFail: ["Roar! Claim failed, try again!", "Hiss! Claim error, retry!", "Growl! Claim hit a snag, retry!"],
            noAmount: ["Roar! Enter a valid amount!", "Hiss! Invalid amount, pick a valid one!", "Growl! Need a valid amount to proceed!"],
            userDenied: ["Roar! You canceled the transaction!", "Hiss! Transaction denied, try again!", "Growl! You said no, let's try again!"],
            networkError: ["Roar! Please switch to Shibarium network!", "Hiss! Wrong network, switch to Shibarium!", "Growl! Connect to Shibarium to proceed!"],
            insufficientBalance: ["Roar! Insufficient balance for staking!", "Hiss! Not enough tokens to stake!", "Growl! Check your balance and try again!"],
            transactionFailed: ["Roar! Transaction failed, try again!", "Hiss! Something went wrong with the transaction!", "Growl! Transaction error, retry!"]
        };
        function getRandomMessage(type) {
            const messages = dragonMessages[type] || ["Error: Unknown message type"];
            return messages[Math.floor(Math.random() * messages.length)];
        }
        async function initializeWeb3() {
            if (!window.ethereum) {
                document.getElementById('networkStatus').innerText = 'Please install MetaMask';
                document.getElementById('dragonMessage').innerText = 'Roar! Install MetaMask to proceed!';
                return;
            }
            try {
                web3 = new Web3(window.ethereum);
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                account = accounts[0];
                document.getElementById('connectWalletButton').innerText = `Connected: ${account.slice(0, 6)}...${account.slice(-4)}`;
                await switchNetwork();
                await initializeContracts();
                await updateBalances();
                document.getElementById('networkStatus').innerText = `Connected to Shibarium`;
                document.getElementById('dragonMessage').innerText = getRandomMessage('connectSuccess');
            } catch (error) {
                if (error.code === 4001) {
                    document.getElementById('networkStatus').innerText = 'User denied wallet connection';
                    document.getElementById('dragonMessage').innerText = getRandomMessage('userDenied');
                } else {
                    document.getElementById('networkStatus').innerText = 'Failed to connect wallet';
                    document.getElementById('dragonMessage').innerText = getRandomMessage('connectFail');
                    console.error("Initialize Web3 error:", error);
                }
            }
        }
        async function switchNetwork() {
            const chainConfig = chains.Shibarium;
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: `0x${chainConfig.chainId.toString(16)}` }]
                });
            } catch (switchError) {
                if (switchError.code === 4902) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: `0x${chainConfig.chainId.toString(16)}`,
                                chainName: chainConfig.chainName,
                                rpcUrls: [chainConfig.rpcUrl],
                                nativeCurrency: { name: 'BONE', symbol: 'BONE', decimals: 18 },
                                blockExplorerUrls: [chainConfig.blockExplorer]
                            }]
                        });
                    } catch (addError) {
                        document.getElementById('networkStatus').innerText = 'Failed to add Shibarium network';
                        document.getElementById('dragonMessage').innerText = 'Roar! Failed to add Shibarium network!';
                        console.error("Add network error:", addError);
                        throw addError;
                    }
                } else {
                    document.getElementById('networkStatus').innerText = 'Failed to switch to Shibarium';
                    document.getElementById('dragonMessage').innerText = 'Roar! Network switch failed, try again!';
                    console.error("Switch network error:", switchError);
                    throw switchError;
                }
            }
        }
        async function checkNetwork() {
            const chainId = await web3.eth.getChainId();
            if (chainId !== chains.Shibarium.chainId) {
                document.getElementById('networkStatus').innerText = 'Please switch to Shibarium network';
                document.getElementById('dragonMessage').innerText = getRandomMessage('networkError');
                return false;
            }
            return true;
        }
        async function initializeContracts() {
            try {
                czRewardsContract = new web3.eth.Contract(czRewardsAbi, czRewardsAddress);
                snowContract = new web3.eth.Contract(erc20Abi, snowAddress);
                czContract = new web3.eth.Contract(erc20Abi, czAddress);
                await snowContract.methods.balanceOf(account).call();
                await czContract.methods.balanceOf(account).call();
            } catch (error) {
                document.getElementById('networkStatus').innerText = 'Failed to initialize contracts';
                document.getElementById('dragonMessage').innerText = 'Roar! Contract or token address error!';
                console.error("Initialize contracts error:", error);
                throw error;
            }
        }
async function updateBalances() {
    if (!web3 || !account || !(await checkNetwork())) return;

    try {
        const snowBal = await snowContract.methods.balanceOf(account).call();
        snowBalance = web3.utils.fromWei(snowBal, 'ether');
        document.getElementById('snowBalance').innerText = `SNOW Balance: ${Number(snowBalance).toLocaleString()}`;
    } catch (error) {
        snowBalance = '0';
        document.getElementById('snowBalance').innerText = 'SNOW Balance: 0';
        console.error("SNOW balance fetch error:", error);
    }

    try {
        const czBal = await czContract.methods.balanceOf(account).call();
        czBalance = web3.utils.fromWei(czBal, 'ether');
        document.getElementById('czBalance').innerText = `CZ Balance: ${Number(czBalance).toLocaleString()}`;
    } catch (error) {
        czBalance = '0';
        document.getElementById('czBalance').innerText = 'CZ Balance: 0';
        console.error("CZ balance fetch error:", error);
    }

    try {
        const userStake = await czRewardsContract.methods.getUserStake(account).call();
        snowStaked = web3.utils.fromWei(userStake.snowAmount, 'ether');
        czStaked = web3.utils.fromWei(userStake.czAmount, 'ether');
        document.getElementById('snowStaked').innerText = `SNOW Staked: ${Number(snowStaked).toLocaleString()}`;
        document.getElementById('czStaked').innerText = `CZ Staked: ${Number(czStaked).toLocaleString()}`;
    } catch (error) {
        snowStaked = '0';
        czStaked = '0';
        document.getElementById('snowStaked').innerText = 'SNOW Staked: 0';
        document.getElementById('czStaked').innerText = 'CZ Staked: 0';
        console.error("Stake fetch error:", error);
    }

    try {
        const pending = await czRewardsContract.methods.getPendingRewards(account).call();
        console.log("Pending Rewards (raw):", pending);
        const snowRewardBN = new web3.utils.BN(pending.snowReward.toString());
        const czRewardBN = new web3.utils.BN(pending.czReward.toString());
        const snowReward = Number(web3.utils.fromWei(snowRewardBN, 'ether'));
        const czReward = Number(web3.utils.fromWei(czRewardBN, 'ether'));
        const totalRewards = snowReward + czReward;
        document.getElementById('pendingRewards').innerText = `Pending Rewards: ${totalRewards.toFixed(6).replace(/\.?0+$/, '')} CZ`;
    } catch (error) {
        document.getElementById('pendingRewards').innerText = 'Pending Rewards: 0 CZ';
        console.error("Pending rewards fetch error:", error.message);
    }
}
        function setSnowStakePercentage(percentage) {
            if (!snowBalance) return;
            const amount = Math.floor((parseFloat(snowBalance) * percentage) / 100 / 100000000) * 100000000;
            document.getElementById('snowStakeAmount').value = amount;
        }
        function setCzStakePercentage(percentage) {
            if (!czBalance) return;
            const amount = Math.floor((parseFloat(czBalance) * percentage) / 100 / 10000) * 10000;
            document.getElementById('czStakeAmount').value = amount;
        }
        function setSnowUnstakePercentage(percentage) {
            if (!snowStaked) return;
            const amount = Math.floor((parseFloat(snowStaked) * percentage) / 100 / 100000000) * 100000000;
            document.getElementById('snowUnstakeAmount').value = amount;
        }
        function setCzUnstakePercentage(percentage) {
            if (!czStaked) return;
            const amount = Math.floor((parseFloat(czStaked) * percentage) / 100 / 10000) * 10000;
            document.getElementById('czUnstakeAmount').value = amount;
        }
        async function waitForTransaction(txHash) {
            let receipt = null;
            const maxAttempts = 30;
            let attempts = 0;
            while (attempts < maxAttempts) {
                receipt = await web3.eth.getTransactionReceipt(txHash);
                if (receipt) {
                    if (receipt.status) return receipt;
                    throw new Error(`Transaction ${txHash} failed`);
                }
                await new Promise(resolve => setTimeout(resolve, 2000));
                attempts++;
            }
            throw new Error(`Transaction ${txHash} not confirmed after ${maxAttempts} attempts`);
        }
        async function handleTransaction(button, statusText, action, successMessage, failMessage, fn) {
            const status = document.getElementById('networkStatus');
            const dragonMessage = document.getElementById('dragonMessage');
            if (!web3 || !account || !(await checkNetwork())) {
                status.innerText = "Please connect wallet and switch to Shibarium.";
                dragonMessage.innerText = getRandomMessage('connectFail');
                return;
            }
            try {
                button.disabled = true;
                button.innerHTML = `${action}... <span class="spinner"></span>`;
                status.innerText = statusText;
                dragonMessage.innerText = getRandomMessage(`${action.toLowerCase().includes('stake') ? 'stake' : action.toLowerCase()}Start`);
                const tx = await fn();
                await waitForTransaction(tx.transactionHash);
                status.innerText = successMessage;
                dragonMessage.innerText = getRandomMessage(`${action.toLowerCase().includes('stake') ? 'stake' : action.toLowerCase()}Success`);
                await updateBalances();
            } catch (error) {
                let failType = action.toLowerCase().includes('stake') ? 'stakeFail' : action.toLowerCase() + 'Fail';
                if (error.message.includes("insufficient funds")) {
                    status.innerText = "Insufficient balance for transaction.";
                    dragonMessage.innerText = getRandomMessage('insufficientBalance');
                } else if (error.code === 4001) {
                    status.innerText = "Transaction canceled by user.";
                    dragonMessage.innerText = getRandomMessage('userDenied');
                } else {
                    status.innerText = failMessage + " Check console for details.";
                    dragonMessage.innerText = getRandomMessage(failType);
                    console.error(`${action} error:`, error);
                }
            } finally {
                button.disabled = false;
                button.innerHTML = action;
            }
        }
